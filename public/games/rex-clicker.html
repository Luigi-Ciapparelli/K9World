let started=false,over=false,ph,cnt,score,d,parts,lock,flash,T,aud;
function newGame(){ph=0;cnt=0;score=0;parts=[];lock=0;flash=0;T=0;over=false;
 d={x:30,gy:405,el:0,vx:0,tvx:0,f:1,ft:1,tilt:0,tiltT:0,sq:0,sqv:0,hz:0,hv:0,st:0,mode:'run',p:0,tm:0,jt:0,jx:0,jg:0,land:0,hopT:0,bias:0}}
newGame();
function ui(m){document.getElementById('score').textContent=score+' punti';
 document.getElementById('step').textContent=over?'Finito!':'Esercizio: '+PH[ph].n+' ('+cnt+'/'+PH[ph].need+')';
 if(m)document.getElementById('msg').textContent=m}
function snd(){if(!document.getElementById('sound').checked)return;try{aud=aud||new (window.AudioContext||window.webkitAudioContext)();
 const o=aud.createOscillator(),v=aud.createGain();o.type='square';o.frequency.value=2400;
 v.gain.setValueAtTime(.25,aud.currentTime);v.gain.exponentialRampToValueAtTime(.001,aud.currentTime+.05);
 o.connect(v);v.connect(aud.destination);o.start();o.stop(aud.currentTime+.06)}catch(e){}}
const sc=()=>Math.max(.45,Math.min(1.05,lerp(.45,1,(d.gy-400)/90)));
function burst(n,ch){const s=sc();for(let i=0;i<n;i++)parts.push({x:d.x+55*s*d.ft,y:d.gy-d.el-150*s,vx:rnd(-170,170),vy:rnd(-330,-80),l:1.6,ch,s:rnd(.8,1.5)})}
function pickLook(){d.ft=Math.random()<.75?-d.ft:d.ft;d.tiltT=rnd(-.12,.1);d.tm=rnd(1.5,2.5)}
function pickMove(){
 const r=Math.random(),b=(ph===3?.8:.5+.12*cnt);d.tm=rnd(1,1.7);
 if(r<b){d.mode='walk';d.dir=1}else if(r<b+.22){d.mode='walk';d.dir=-1;d.tm=.8}
 else{d.mode='idle';d.tm=rnd(.5,1);d.ft=Math.random()<.5?-1:1;d.tiltT=rnd(-.1,.1)}}
function inWindow(){
 if(ph===0)return (d.mode==='run'&&d.p>.35)||d.mode==='idle';
 if(ph===1)return d.mode==='idle'&&d.ft===1&&d.f>.95;
 if(ph===2)return d.mode==='walk'&&d.vx>35;
 return d.mode==='plat'&&d.land>.25}
function click(){
 if(!started||over||paused)return;snd();flash=guided?0:.18;
 if(lock>0){ui('Un click alla volta! Aspetta il prossimo momento.');return}
 if(!inWindow()){ui('Troppo presto o troppo tardi · '+PH[ph].h);return}
 const P=PH[ph];score+=P.pts;cnt++;lock=1.3;d.hv=ph===3?0:260;
 burst(5,'🦴');burst(ph===3?20:7,'⭐');
 if(cnt>=P.need){
  if(ph===3){over=true;d.mode='cheer';d.ft=1;burst(40,'🦴');burst(55,'⭐');
   document.getElementById('btn').textContent='Gioca ancora';
   ui('BRAVISSIMO REX! Totale: '+score+' punti. Hai completato il percorso!');finishAt=T;pauseButton.disabled=true;nextButton.disabled=true;checkpoint();return}
  ph++;cnt=0;ui('Bravo Rex! +'+P.pts+' e un premio. Prossimo: '+PH[ph].h);
  if(ph===1){d.mode='idle';d.tm=.6;d.ft=-1}else{d.mode='idle';d.tm=.5}}
 else ui('CLICK! +'+P.pts+' punti e un premio ('+cnt+'/'+P.need+')');checkpoint()}
function update(dt){
 T+=dt;if(flash>0)flash-=dt;if(lock>0)lock-=dt;
 parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=520*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);
 if(!started)return;
 const k=(r)=>1-Math.exp(-r*dt);
 d.sqv+=(-d.sq*160-d.sqv*13)*dt;d.sq+=d.sqv*dt;
 if(d.hz>0||d.hv!==0){d.hv-=1000*dt;d.hz+=d.hv*dt;if(d.hz<=0){d.hz=0;if(d.hv<-160)d.sqv-=2.5;d.hv=0}}
 d.f+=(d.ft-d.f)*k(9);d.tilt+=(d.tiltT-d.tilt)*k(6);d.vx+=(d.tvx-d.vx)*k(7);
 d.st+=Math.abs(d.vx)*dt*.075;
 const m=d.mode;
 if(m==='run'){d.p+=dt/3.4;const e=eo(Math.min(1,d.p));d.x=lerp(30,400,e);d.gy=lerp(405,492,e);
  d.tvx=d.vx=150*(1-d.p)+30;d.ft=1;if(d.p>=1){d.mode='idle';d.tm=1.2;d.tvx=0}}
 else if(m==='idle'){d.tvx=0;d.tm-=dt;
  if(d.tm<=0){if(ph<=1)pickLook();else pickMove()}}
 else if(m==='walk'){
  const xMax=ph===2?PX0-115:PX0-140;d.ft=d.dir;d.tvx=d.dir*95;d.x+=d.vx*dt;d.tm-=dt;
  d.gy+=(486-d.gy)*k(1.5);
  if(d.x<110){d.x=110;d.dir=1}
  if(ph===3&&d.dir>0&&d.x>PX0-215){d.mode='crouch';d.tm=.22;d.tvx=0;d.sqv-=3}
  else if(d.x>xMax&&ph===2){d.x=xMax;d.mode='idle';d.tm=.7;d.ft=1}
  else if(d.tm<=0){d.mode='idle';d.tm=rnd(.4,.9);d.tvx=0}}
 else if(m==='crouch'){d.tvx=0;d.tm-=dt;d.ft=1;
  if(d.tm<=0){d.mode='jump';d.jt=0;d.jx=d.x;d.jg=d.gy;d.sqv+=3.5}}
 else if(m==='jump'){d.jt=Math.min(1,d.jt+dt/.8);const t=d.jt;
  d.x=lerp(d.jx,PX0+105,eio(t));d.gy=lerp(d.jg,PGY,t);d.el=PEL*t+75*Math.sin(Math.PI*t);d.vx=100;
  if(t>=1){d.mode='plat';d.land=0;d.el=PEL;d.gy=PGY;d.sqv-=4;d.tvx=0}}
 else if(m==='plat'){d.land+=dt;d.vx=0;d.tiltT=Math.sin(T*2)*.04}
 else if(m==='cheer'){d.vx=0;d.hopT-=dt;if(d.hopT<=0&&d.hz===0){d.hv=rnd(300,380);d.hopT=.55}}
}
function draw(){
 if(ld<2){g.fillStyle='#8fc4f0';g.fillRect(0,0,960,540);return}
 g.drawImage(bgI,0,0,960,540);
 const s=sc(),h=200*s,w=h*413/460;
 const sy=d.gy;g.save();g.globalAlpha=Math.max(.12,.35-d.hz/500-(d.mode==='jump'?.08:0));
 const sh=d.mode==='jump'?PEL*d.jt:d.el;g.fillStyle='#143';g.beginPath();
 g.ellipse(d.x,d.gy-sh,w*.42*(1-Math.min(.5,(d.hz+(d.mode==='jump'?d.el-sh:0))/300)),9*s,0,0,7);
 g.fill();g.restore();
 const moving=Math.abs(d.vx)>8,bob=moving?Math.abs(Math.sin(d.st))*6*s:Math.sin(T*3)*1.2*s;
 const lean=moving?Math.sin(d.st)*.03:0;
 let rot=d.tilt+lean+d.vx*.0004;
 if(d.mode==='jump')rot=-.28*(1-2*d.jt);
 g.save();g.translate(d.x,d.gy-d.el-d.hz);
 g.translate(0,-bob);g.rotate(rot*Math.sign(d.f||1));
 const sq=d.sq+(moving?Math.sin(d.st*2)*.02:Math.sin(T*3)*.008);
 g.scale(d.f*(1-sq*.5),1+sq);g.drawImage(dogI,-w/2,-h,w,h);g.restore();
 g.textAlign='center';parts.forEach(p=>{g.save();g.globalAlpha=Math.min(1,p.l);g.translate(p.x,p.y);g.scale(p.s,p.s);g.strokeStyle='#8a5621';g.lineWidth=1.2;
 if(p.ch==='⭐'){g.fillStyle='#ffdc58';g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?5:12;const x=Math.cos(a)*r,y=Math.sin(a)*r;if(i===0)g.moveTo(x,y);else g.lineTo(x,y)}g.closePath();g.fill();g.stroke()}
 else{g.rotate(-.5);g.fillStyle='#fff2d8';g.fillRect(-8,-3,16,6);for(const x of [-9,9])for(const y of [-3,3]){g.beginPath();g.arc(x,y,4,0,Math.PI*2);g.fill()} }
 g.restore()});g.globalAlpha=1;
 if(flash>0){g.fillStyle='rgba(255,246,168,'+flash*1.6+')';g.fillRect(0,0,960,540);
  g.fillStyle='#e0561e';g.font='bold 54px sans-serif';g.fillText('CLICK!',480,90)}
}

// Integration boundary: no account data, storage, network or parent DOM access.
const steps=['arrival','look','approach','platform'];
const channel=decodeURIComponent(location.hash.slice(1));
const hostOrigin=(()=>{try{return new URL(document.referrer).origin}catch{return '*'}})();
let paused=false,visible=true,guided=matchMedia('(prefers-reduced-motion: reduce)').matches;
let initialized=false,saved,raf=0,last=performance.now(),finishAt=0;
const pauseButton=document.getElementById('pause'),nextButton=document.getElementById('next');
document.getElementById('guided').checked=guided;nextButton.hidden=!guided;
function notify(type,more={}){if(parent!==window)parent.postMessage({source:'rex-clicker',channel,type,...more},hostOrigin)}
function resize(){notify('resize',{height:Math.ceil(document.body.getBoundingClientRect().height)+4})}
new ResizeObserver(resize).observe(document.body);
function valid(p){return p&&p.exercise==='rex-clicker-v1'&&Array.isArray(p.completed)&&p.completed.length<=4&&
 p.completed.every((v,i)=>v===steps[i])&&Number.isInteger(p.hits)&&p.hits>=0&&p.hits<(PH[p.completed.length]?.need??1)}
function checkpoint(){notify('progress',{progress:{exercise:'rex-clicker-v1',completed:steps.slice(0,over?4:ph),hits:over?0:cnt}})}
addEventListener('message',e=>{
 if(e.source!==parent||hostOrigin!=='*'&&e.origin!==hostOrigin)return;
 const m=e.data;if(!m||m.source!=='portalecinofilo'||m.channel!==channel)return;
 if(m.type==='hello'&&ld===2)notify('ready');
 if(m.type==='init'&&!initialized){initialized=true;if(valid(m.progress)&&m.progress.completed.length<4){saved=m.progress;if(saved.completed.length||saved.hits){document.getElementById('btn').textContent='Riprendi';ui('Riprendi Rex dal tuo ultimo click corretto.')}}}
 if(m.type==='theme'){document.documentElement.dataset.theme=m.dark?'dark':'light';resize()}
 if(m.type==='visibility'){visible=m.visible===true;schedule()}
});
function describe(){
 let text=!started?'Rex sta per arrivare.':over?'Rex è sulla pedana: percorso completato.':
 d.mode==='run'?'Rex si sta avvicinando a te.':d.mode==='walk'?(d.vx>35?'Rex cammina verso la pedana.':'Rex sta camminando, ma non ancora verso la pedana.'):
 d.mode==='jump'?'Rex sta saltando. Aspetta che sia sulla pedana.':d.mode==='plat'?'Rex è sulla pedana.':
 d.mode==='crouch'?'Rex si prepara a saltare.':d.ft===1&&d.f>.95?'Rex guarda verso la pedana.':'Rex guarda altrove.';
 if(paused)text='Gioco in pausa. Premi Riprendi gioco per continuare.';
 const el=document.getElementById('scene');if(el.textContent!==text)el.textContent=text;
}
function canAnimate(){return ld===2&&started&&!paused&&!guided&&visible&&!document.hidden&&(!over||T-finishAt<2.5)}
function schedule(){
 if(!canAnimate()){if(raf)cancelAnimationFrame(raf);raf=0;return}
 if(!raf){last=performance.now();raf=requestAnimationFrame(loop)}
}
function loop(n){raf=0;const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();describe();if(canAnimate())raf=requestAnimationFrame(loop)}
function act(){
 if(ld<2||paused)return;
 if(!started||over){
  newGame();started=true;finishAt=0;
  if(saved){ph=saved.completed.length;cnt=saved.hits;score=PH.slice(0,ph).reduce((n,p)=>n+p.pts*p.need,0)+PH[ph].pts*cnt;
   if(ph>0){d.x=ph===3?560:400;d.gy=486;d.mode='idle';d.tm=.6;d.ft=-1;d.f=-1}saved=undefined}
  document.getElementById('btn').textContent='CLICK!';pauseButton.disabled=false;nextButton.disabled=false;ui(PH[ph].h);
 }else click();
 draw();describe();schedule();
}
document.getElementById('btn').onclick=act;
document.addEventListener('keydown',e=>{
 if(e.code==='Space'&&!e.target.closest('input,button,a')){e.preventDefault();if(!e.repeat)act()}
});
cv.addEventListener('pointerdown',act);
pauseButton.onclick=()=>{paused=!paused;pauseButton.textContent=paused?'Riprendi gioco':'Metti in pausa';document.getElementById('btn').disabled=paused;nextButton.disabled=paused;schedule();describe()};
document.getElementById('guided').onchange=e=>{guided=e.target.checked;nextButton.hidden=!guided;schedule();draw()};
nextButton.onclick=()=>{if(!started||over||paused)return;for(let i=0;i<40;i++)update(.05);draw();describe()};
document.addEventListener('visibilitychange',schedule);
addEventListener('pagehide',()=>{if(raf)cancelAnimationFrame(raf);if(aud)aud.close()});
resize();describe();
</script></body></html>
